<figure class="fig" data-added="fig" data-fig="D18">
  <figcaption class="fig-cap"><span class="fig-no">图解 D18</span><span>工厂制度及合股制度的运作（资料5.47）</span></figcaption>
  <div class="fig-body"><svg class="dg" viewBox="0 0 760 412" role="img" aria-label="循环图：资本家投资兴建工厂、聘请人员、购置机器，大规模生产棉织品，在市场出售得到利润；利润吸引投资者购买股票或债券，提供更多资本，再投入工厂" style="min-width:640px">
    <defs><marker id="ah-D18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ah-D18-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ah-D18-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-red" d="M0,1 L10,5 L0,9 z"/></marker></defs>

    <!-- 资本家 -->
    <rect class="box-blue" x="80" y="14" width="100" height="36" rx="3"/>
    <text x="130" y="37" class="t-b" text-anchor="middle">资本家</text>
    <text x="196" y="28" class="t-s">“投资机器与厂房成本不低，我们需要筹集资金，</text>
    <text x="196" y="43" class="t-s">组成合股公司。”</text>
    <line class="ln-ink" x1="130" y1="50" x2="130" y2="89" marker-end="url(#ah-D18)"/>
    <text x="138" y="74" class="t-s t-b">投资</text>

    <!-- 上排：工厂 → 大规模生产 → 棉织品 -->
    <rect class="box" x="30" y="90" width="200" height="74" rx="3"/>
    <circle class="dot" cx="50" cy="111" r="7"/><text x="50" y="115" class="t-s t-inv t-b" text-anchor="middle">1</text>
    <text x="64" y="115">兴建工厂</text>
    <circle class="dot" cx="50" cy="130" r="7"/><text x="50" y="134" class="t-s t-inv t-b" text-anchor="middle">2</text>
    <text x="64" y="134">聘请管理人员与工人</text>
    <circle class="dot" cx="50" cy="149" r="7"/><text x="50" y="153" class="t-s t-inv t-b" text-anchor="middle">3</text>
    <text x="64" y="153">购置机器</text>
    <line class="ln-blue" x1="230" y1="127" x2="309" y2="127" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="310" y="109" width="120" height="36" rx="3"/>
    <text x="370" y="132" text-anchor="middle">大规模生产</text>
    <line class="ln-blue" x1="430" y1="127" x2="559" y2="127" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="560" y="109" width="100" height="36" rx="3"/>
    <text x="610" y="132" text-anchor="middle">棉织品</text>

    <!-- 右列 -->
    <line class="ln-blue" x1="610" y1="145" x2="610" y2="211" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="550" y="212" width="120" height="36" rx="3"/>
    <text x="610" y="235" text-anchor="middle">在市场出售</text>
    <line class="ln-blue" x1="610" y1="248" x2="610" y2="314" marker-end="url(#ah-D18-blue)"/>

    <!-- 下排：利润 → 吸引投资者 → 股票或债券 -->
    <rect class="box" x="560" y="315" width="100" height="36" rx="3"/>
    <text x="610" y="338" class="t-b" text-anchor="middle">利润</text>
    <line class="ln-blue" x1="560" y1="333" x2="431" y2="333" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="310" y="315" width="120" height="36" rx="3"/>
    <text x="370" y="338" text-anchor="middle">吸引投资者</text>
    <text x="370" y="370" class="t-s" text-anchor="middle">“这间公司有潜质，值得投资！”</text>
    <line class="ln-blue" x1="310" y1="333" x2="231" y2="333" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="30" y="315" width="200" height="36" rx="3"/>
    <text x="130" y="338" text-anchor="middle">投资于资本家发行的股票或债券</text>

    <!-- 左列：回到工厂 -->
    <line class="ln-blue" x1="130" y1="315" x2="130" y2="249" marker-end="url(#ah-D18-blue)"/>
    <rect class="box" x="65" y="212" width="130" height="36" rx="3"/>
    <text x="130" y="235" text-anchor="middle">提供更多资本</text>
    <line class="ln-red" x1="130" y1="212" x2="130" y2="165" marker-end="url(#ah-D18-red)"/>
    <text x="138" y="193" class="t-s t-b t-red">再投入工厂</text>

    <!-- 中央说明 -->
    <text x="370" y="182" class="t-s t-b t-blue" text-anchor="middle">工厂制度</text>
    <text x="370" y="198" class="t-s" text-anchor="middle">兴建工厂、安置昂贵庞大的机器，</text>
    <text x="370" y="213" class="t-s" text-anchor="middle">雇用大量工人操作机器进行大规模生产</text>
    <text x="370" y="260" class="t-s t-b t-blue" text-anchor="middle">合股制度</text>
    <text x="370" y="276" class="t-s" text-anchor="middle">发行股票或债券筹集资金，</text>
    <text x="370" y="291" class="t-s" text-anchor="middle">有助集合更多生产资源、扩大规模、赚取更多利润</text>

    <text x="16" y="400" class="t-s t-yel">易错：资料5.47更适合描述19世纪中后期，而不是工业革命初期的典型做法</text>
  </svg></div>
  <p class="fig-note">依据：3.2⑥(a) 资料5.47及“(i) 工厂制度的形成”“(ii) 合股制度的发展”；易错提示据同节核查“合股制度的时间要分清”（《泡沫法》1720—1825年限制自由成立合股公司，棉纺业合股热潮要到1873—1875年才在奥尔德姆出现）。</p>
</figure>
