<figure class="fig" data-added="fig" data-fig="D19">
  <figcaption class="fig-cap"><span class="fig-no">图解 D19</span><span>工业革命后西方国家与殖民地的关系（资料5.58）</span></figcaption>
  <div class="fig-legend"><span><i style="background:var(--blue)"></i>课本循环图</span><span><i style="background:var(--grn)"></i>原文补充：模型的边界</span></div>
  <div class="fig-body"><svg class="dg" viewBox="0 0 760 244" role="img" aria-label="循环图：工业上应用机器令产量大大提高，导致西方工业国家需要更多资源和海外市场，导致在亚、非、拉丁美洲进行经济与殖民地扩张，再导致机器生产扩大；旁注说明这是只呈现经济动机的解释模型" style="min-width:640px">
    <defs><marker id="ah-D19-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,1 L10,5 L0,9 z"/></marker></defs>

    <!-- 1 -->
    <rect class="box-blue" x="200" y="16" width="280" height="36" rx="3"/>
    <text x="340" y="39" class="t-b" text-anchor="middle">工业上应用机器，令产量大大提高</text>
    <path class="ln-blue" d="M340,52 V72 H235 V95" marker-end="url(#ah-D19-blue)"/>
    <path class="ln-blue" d="M340,52 V72 H445 V95" marker-end="url(#ah-D19-blue)"/>
    <text x="348" y="66" class="t-s t-blue">导致</text>

    <!-- 2 -->
    <rect class="box-blue" x="140" y="96" width="190" height="52" rx="3"/>
    <text x="150" y="117">西方工业国家需要</text>
    <text x="150" y="136">更多资源生产<tspan class="t-s">（图示煤、石油）</tspan></text>
    <rect class="box-blue" x="350" y="96" width="190" height="52" rx="3"/>
    <text x="360" y="117">西方工业国家需要寻找</text>
    <text x="360" y="136">更多海外市场来消费商品</text>
    <path class="ln-blue" d="M235,148 V168 H340"/>
    <path class="ln-blue" d="M445,148 V168 H340 V191" marker-end="url(#ah-D19-blue)"/>
    <text x="348" y="185" class="t-s t-blue">导致</text>

    <!-- 3 -->
    <rect class="box-blue" x="150" y="192" width="380" height="36" rx="3"/>
    <text x="340" y="215" class="t-b" text-anchor="middle">西方工业国家在亚、非、拉丁美洲进行经济与殖民地扩张</text>

    <!-- 回到起点 -->
    <path class="ln-blue" d="M150,210 H40 V34 H199" marker-end="url(#ah-D19-blue)"/>
    <text x="48" y="116" class="t-s t-b t-blue">再导致</text>
    <text x="48" y="131" class="t-s t-b t-blue">机器生产扩大</text>

    <!-- 边界旁注 -->
    <rect class="box-grn" x="556" y="16" width="190" height="212" rx="3"/>
    <text x="566" y="38" class="t-s t-b t-grn">解释模型要有边界</text>
    <text x="566" y="62" class="t-s t-grn">这是编者画的解释模型，</text>
    <text x="566" y="78" class="t-s t-grn">不是史料；只呈现经济动机。</text>
    <text x="566" y="106" class="t-s t-grn">工业革命还提供了扩张的手段：</text>
    <text x="566" y="122" class="t-s t-grn">汽船、奎宁（预防疟疾）与后膛枪</text>
    <text x="566" y="138" class="t-s t-grn">等技术，使欧洲人能深入非洲与</text>
    <text x="566" y="154" class="t-s t-grn">亚洲内陆。</text>
    <text x="566" y="182" class="t-s t-grn">——赫德里克《帝国的工具》</text>
    <text x="566" y="198" class="t-s t-grn">（<tspan class="t-num">1981</tspan>，学者观点）</text>
  </svg></div>
  <p class="fig-note">依据：3.2⑥(g) 资料5.58及“解释模型要有边界”（学者观点，原文注明已核实）。读图：作答时可引用此循环说明经济动机，但应补充技术“手段”与其他解释，避免把殖民扩张只归因于经济。</p>
