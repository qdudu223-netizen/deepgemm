<figure class="fig" data-added="fig" data-fig="D7">
  <figcaption class="fig-cap"><span class="fig-no">图解 D7</span><span>工业革命的演进概览（资料5.36）</span></figcaption>
  <div class="fig-legend"><span><i style="background:var(--blue)"></i>演进阶段（课本）</span><span><i style="background:var(--yel-fill)"></i>原文核查：课本说法需修正</span></div>
  <div class="fig-body"><svg class="dg" viewBox="0 0 760 556" role="img" aria-label="资料5.36：英国三项条件促成率先展开工业革命，其后依次为技术革命、动力革命、交通革命，再扩展至欧洲及其他地区；旁注两处课本说法的核查" style="min-width:660px">
    <defs><marker id="ah-D7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ah-D7-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,1 L10,5 L0,9 z"/></marker></defs>

    <!-- 英国三条件 -->
    <text x="16" y="22" class="t-l t-serif">英国</text>
    <rect class="box" x="16" y="34" width="232" height="70" rx="3"/>
    <text x="28" y="56" class="t-b">①原料供应与海外市场庞大</text>
    <text x="28" y="76" class="t-s">英国拥有大量工业原料；</text>
    <text x="28" y="93" class="t-s">海外市场为英国工业带来庞大需求</text>
    <rect class="box" x="264" y="34" width="232" height="70" rx="3"/>
    <text x="276" y="56" class="t-b">②圈地运动合法化</text>
    <text x="276" y="76" class="t-s">很多农民失去耕地，</text>
    <text x="276" y="93" class="t-s">为英国提供大量劳动力</text>
    <rect class="box" x="512" y="34" width="232" height="70" rx="3"/>
    <text x="524" y="56" class="t-b">③政府支持科技创新</text>
    <text x="524" y="76" class="t-s">设立专利制度；</text>
    <text x="524" y="93" class="t-s">支持科学研究机构</text>
    <path class="ln-ink" d="M132,104 V118 H628 V104"/>
    <line class="ln-ink" x1="380" y1="104" x2="380" y2="118"/>
    <line class="ln-ink" x1="304" y1="118" x2="304" y2="133" marker-end="url(#ah-D7)"/>

    <rect class="box-blue" x="214" y="134" width="180" height="36" rx="3"/>
    <text x="304" y="157" class="t-b t-blue" text-anchor="middle">率先展开工业革命</text>
    <line class="ln-blue" x1="304" y1="170" x2="304" y2="199" marker-end="url(#ah-D7-blue)"/>

    <!-- 阶段 1 -->
    <text x="110" y="223" class="t-b t-blue" text-anchor="end">约<tspan class="t-num">1750</tspan>年代</text>
    <text x="110" y="239" class="t-s" text-anchor="end">展开</text>
    <rect class="box-blue" x="124" y="200" width="360" height="52" rx="3"/>
    <text x="136" y="221" class="t-b">技术革命</text>
    <text x="136" y="241">发明珍妮纺纱机</text>
    <line class="ln-blue" x1="304" y1="252" x2="304" y2="275" marker-end="url(#ah-D7-blue)"/>

    <!-- 阶段 2 -->
    <text x="110" y="307" class="t-b t-blue" text-anchor="end">约<tspan class="t-num">1770</tspan>年代</text>
    <text x="110" y="323" class="t-s" text-anchor="end">展开</text>
    <rect class="box-blue" x="124" y="276" width="360" height="70" rx="3"/>
    <text x="136" y="297" class="t-b">动力革命</text>
    <text x="136" y="317">瓦特于<tspan class="t-num">1769</tspan>年改良蒸汽机，蒸汽逐渐成为</text>
    <text x="136" y="335">推动机器及交通工具的主要能源</text>
    <line class="ln-blue" x1="304" y1="346" x2="304" y2="369" marker-end="url(#ah-D7-blue)"/>

    <!-- 阶段 3 -->
    <text x="110" y="393" class="t-b t-blue" text-anchor="end">约<tspan class="t-num">1800</tspan>年代</text>
    <text x="110" y="409" class="t-s" text-anchor="end">展开</text>
    <rect class="box-blue" x="124" y="370" width="360" height="52" rx="3"/>
    <text x="136" y="391" class="t-b">交通革命</text>
    <text x="136" y="411">新式蒸汽船与蒸汽火车相继问世，铁路建设迅速扩展</text>
    <line class="ln-blue" x1="304" y1="422" x2="304" y2="463" marker-end="url(#ah-D7-blue)"/>
    <text x="312" y="447" class="t-s t-blue">扩展</text>

    <!-- 阶段 4 -->
    <text x="110" y="487" class="t-b t-blue" text-anchor="end">约<tspan class="t-num">1800</tspan>年代</text>
    <text x="110" y="503" class="t-s" text-anchor="end">展开</text>
    <rect class="box-blue" x="124" y="464" width="360" height="70" rx="3"/>
    <text x="136" y="485" class="t-b">传播至欧洲及其他地区</text>
    <text x="136" y="505">其他欧洲国家仿效英国；<tspan class="t-yel">英国在海外殖民地建设工厂，</tspan></text>
    <text x="136" y="523" class="t-yel">把工业革命带到欧洲以外的地区</text>

    <!-- 核查旁注 -->
    <line class="ln-dash" x1="484" y1="226" x2="503" y2="226"/>
    <rect class="box-yel" x="504" y="191" width="240" height="70" rx="3"/>
    <text x="514" y="209" class="t-s t-yel">核查：珍妮纺纱机的年份是<tspan class="t-num">1764</tspan>年</text>
    <text x="514" y="224" class="t-s t-yel">（<tspan class="t-num">1770</tspan>年取得专利）；“<tspan class="t-num">1750</tspan>年代”</text>
    <text x="514" y="239" class="t-s t-yel">只是阶段的大约起点。更早的飞梭</text>
    <text x="514" y="254" class="t-s t-yel">（凯伊，<tspan class="t-num">1733</tspan>年）也属纺织技术革新。</text>

    <line class="ln-dash" x1="484" y1="499" x2="503" y2="499"/>
    <rect class="box-yel" x="504" y="452" width="240" height="94" rx="3"/>
    <text x="514" y="470" class="t-s t-yel t-b">片面说法：</text>
    <text x="514" y="485" class="t-s t-yel">印度在<tspan class="t-num">1750</tspan>年约占世界工业产出四分之一，</text>
    <text x="514" y="500" class="t-s t-yel">至<tspan class="t-num">1900</tspan>年跌至约<tspan class="t-num">2%</tspan>，出现“去工业化”。</text>
    <text x="514" y="515" class="t-s t-yel">宜写：工业技术传到部分殖民地，但不少</text>
    <text x="514" y="530" class="t-s t-yel">殖民地同时沦为原料产地和英国制品的市场</text>
  </svg></div>
  <p class="fig-note">依据：3.2④-0 资料5.36及“核查与易错”。读图：箭头次序是课本的阶段划分，年代只是大约起点；印度“去工业化”的原因有争议（内部问题与外部冲击可能互补）。</p>
</figure>
