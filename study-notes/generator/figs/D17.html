    <text x="212" y="143">欧洲国家工业产品</text>

    <text x="212" y="179">新式交通工具相继出现</text>

  <p class="fig-note">依据：3.2⑥“历史技能：辨别转折点”（课本第54页）的方法与例子1、例子2。转折点＝历史不再沿原有趋势、朝新方向发展；判断时看“之后”与“之前”相比有没有根本性改变。例子1的结论取决于所选标准（见5.4争议②），课本例子示范的是方法。</p>
